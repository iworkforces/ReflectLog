# Development environment for the plugin in the parent directory. Hermes copies
# the plugin's own pyproject.toml into a uv workspace whose root is hermes-agent,
# so the Hermes pin and the dev tools live here instead.
[project]
name = "hermes-plugin-reflectlog-dev"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
# Keep equal to the plugin's [project].dependencies.
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "hermes-agent"]

[tool.uv]
package = false

[tool.uv.sources]
hermes-agent = { git = "https://github.com/NousResearch/hermes-agent.git", tag = "v0.21.6" }

# Upstream refuses non-Nix wheel builds; this import-only build is for tests.
[tool.uv.extra-build-variables]
hermes-agent = { HERMES_NIX_BUILD = "1" }
