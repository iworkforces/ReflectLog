[project]
name = "hermes-plugin-reflectlog"
version = "0.1.0"
description = "ReflectLog memory-provider plugin for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

# Hermes installs this file as a member of its own uv workspace. Keep uv
# settings and dev tools in dev/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "Q", "ANN", "TC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["E", "W", "F", "N", "UP", "B", "C4", "RUF", "SIM105", "SIM117", "SIM300", "ANN", "TC"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["."]
exclude = ["**/.venv", "**/__pycache__", ".pytest_cache", ".ruff_cache"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
strict = ["core", "provider.py", "tool_handlers.py", "__init__.py", "qa"]
venvPath = "dev"
venv = ".venv"
