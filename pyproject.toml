[project]
name = "reflectlog"
version = "0.4.1"
description = "ReflectLog Is A MCP Server For AI Agent Workspace-based Memories"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "iworkforces Engineers" }
]
requires-python = ">=3.14.4"
keywords = ["mcp", "semantic-memory", "hybrid-search", "vector-database", "ai-agent", "reflectlog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastmcp==4.0.10",
    "pydantic==2.14.0b2",
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "asyncer>=0.0.18",
    "anyio>=4.15.1",
    "python-dotenv>=1.2.3",
    "dynaconf>=3.3.5",
    "mcp>=2.2.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "httptools>=0.8.0",
    "starlette>=1.7.0",
    "openai>=3.19.2",
    "tiktoken>=0.14.0",
    "aiohttp>=3.14.3",
    "aiodns>=4.0.4",
    "httpx-aiohttp>=0.2.0",
    "tantivy>=0.26.2",
    "usearch>=2.26.2",
    "numba>=0.67.0",
    "ranx==0.3.21",
    "portalocker==4.4.0",
    "httpx[http2]>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
    "llvmlite==0.49.0",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "sentence-transformers==6.1.0",
    "flagembedding>=1.4.2",
    "transformers==5.17.0",
    "qwen-vl-utils[decord]==0.0.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "qwen-vl-utils==0.0.14; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "accelerate>=1.15.0",
    "claude-agent-sdk>=0.2.160",
    "pydantic-core==2.49.0",
]

[project.urls]
Homepage = "https://github.com/iworkforces/ReflectLog"
Repository = "https://github.com/iworkforces/ReflectLog"
Issues = "https://github.com/iworkforces/ReflectLog/issues"
Documentation = "https://github.com/iworkforces/ReflectLog#readme"

[project.scripts]
reflectlog = "reflectlog.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflectlog"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ty>=0.0.84",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/security"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Ignore numba type safety warnings from ranx library (internal ranx issue)
    "ignore::numba.core.errors.NumbaTypeSafetyWarning",
]

[tool.coverage.run]
source = ["reflectlog"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ty.environment]
# Target Python version
python-version = "3.14"
# Custom stub paths (equivalent to mypy_path)
extra-paths = ["stubs"]

[tool.ty.src]
# Include project source and tests
include = ["reflectlog", "tests"]
# Exclude common non-source directories
exclude = [
    "indexes/",
    ".venv/",
    "__pycache__/",
]

[tool.ty.rules]
# Strict type checking rules (equivalent to mypy strict mode)
# Core type errors
unresolved-reference = "error"
invalid-type-form = "error"
call-non-callable = "error"

# Import resolution - warn for third-party libraries without stubs
unresolved-import = "error"

# Assignment and return type errors
# invalid-argument-type covers Sized/Container mismatches (len, operator.contains)
invalid-assignment = "error"
invalid-return-type = "error"
invalid-argument-type = "error"

# Redundancy warnings
redundant-cast = "error"

# Unused / unknown — keep fail-closed. ty has no unused-function rule;
# pyright reportUnusedFunction owns unused helpers (including _-prefixed).
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
blanket-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"

# Attribute access — getattr / optional_attr are banned; missing members fail closed
unresolved-attribute = "error"
possibly-missing-attribute = "error"
invalid-attribute-access = "error"
unknown-argument = "error"
call-top-callable = "error"

# Module-specific rules for third-party libraries without stubs
possibly-missing-import = "error"

# Extra hygiene. unsound-* stays at default ignore: tests use mocks
# whose types are assignable but not subtypes (MagicMock, Queue[Any]).
possibly-unresolved-reference = "error"
ambiguous-protocol-member = "error"
unresolved-global = "error"
useless-overload-body = "error"

[tool.ty.terminal]
output-format = "full"
error-on-warning = true

[tool.pyright]
# Mirrors pyrightconfig.json for unused helpers and the issues this change set closes.
# Full strict settings remain in pyrightconfig.json.
reportArgumentType = "error"
reportAttributeAccessIssue = "error"
reportGeneralTypeIssues = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportUnknownMemberType = "error"
reportUnusedFunction = "error"
reportUnusedClass = "error"

[tool.ruff]
# Target Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable pyupgrade rules for Python 3.14+ syntax
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade - Python 3.14+ modernizations
    "B",     # flake8-bugbear (B009 forbids getattr with a constant name)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "Q",     # flake8-quotes - enforce double quotes
    "ANN",   # flake8-annotations - require parameter and return annotations
    "TC",    # flake8-type-checking - keep typing-only imports out of runtime
    "PYI",   # flake8-pyi - typing/stub annotation quality
]
# Fixable rules (can be auto-fixed with --fix)
fixable = ["UP", "I", "N", "F", "E", "W", "Q", "SIM", "TC"]

[tool.ruff.lint.per-file-ignores]
# I001 and SIM102 stay enforced in tests. Other SIM nits stay ignored there.
"tests/**/*" = [
    "E",
    "W",
    "F",
    "N",
    "UP",
    "B",
    "C4",
    "RUF",
    "E501",
    "SIM105",
    "SIM117",
    "SIM300",
    "ANN",
    "TC",
    "PYI",
]
"reflectlog/**/*" = ["E501"]
"stubs/**/*" = ["E501"]

[tool.ruff.lint.flake8-annotations]
# Logger extras, HTTP client options, and tool kwargs stay **kwargs: Any.
# Bare Any on named parameters and returns is still ANN401.
allow-star-arg-any = true
mypy-init-return = false
suppress-dummy-args = true
suppress-none-returning = false

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at runtime for models and validate_call.
# Numba reads JIT signatures at import, so NDArray must stay a runtime name.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "pydantic.dataclasses.dataclass",
    "pydantic.validate_call",
    "numba.jit",
    "jit",
]

[tool.ruff.lint.isort]
single-line-exclusions = ["typing", "collections.abc"]
known-first-party = ["reflectlog"]
force-sort-within-sections = true

[tool.ruff.lint.pep8-naming]
# Ignore tests for naming conventions. mimeType/isError match MCP payloads.
ignore-names = ["test_*", "*_test", "mimeType", "isError"]

[tool.ruff.lint.pyupgrade]
# Python 3.14+ modernizations
keep-runtime-typing = false

[tool.ruff.lint.flake8-quotes]
# Enforce double quotes (project convention)
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.format]
# Use double quotes for strings (ruff formatter)
quote-style = "double"
